name: Trigger ADO Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger ADO Pipeline
        env:
          ADO_TOKEN: ${{ secrets.ADO_TOKEN }}
          AZURE_DEVOPS_URL: https://dev.azure.com/girishnshet10/inheritedagile
          BUILD_ID: "32"

        run: |
          set -e

          PR_REF="refs/pull/${{ github.event.pull_request.number }}/merge"

          COMMIT_MESSAGE="${{ github.event.pull_request.title }}

          $(python3 -c "print('LONGTEXT'*5000)")"

          PAYLOAD=$(jq -n \
            --argjson id "$BUILD_ID" \
            --arg source_branch "$PR_REF" \
            --arg sha "${{ github.event.pull_request.head.sha }}" \
            --arg message "$COMMIT_MESSAGE" \
            '{
              definition: { id: $id },
              reason: "manual",
              sourceBranch: $source_branch,
              triggerInfo: {
                "ci.sourceVersion": $sha,
                "ci.message": $message
              }
            }')

          echo "Payload created successfully"

          curl -X POST \
            -H "Authorization: Bearer $ADO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$AZURE_DEVOPS_URL/_apis/build/builds?api-version=7.0"
